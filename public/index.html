<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/boot.css">
<link rel="stylesheet" href="/chat.css">
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <h1 class="gate-title">Dashboard</h1>
    <p class="gate-sub">Enter your password to continue.</p>
    <input id="password" type="password" autocomplete="current-password" spellcheck="false" placeholder="Password">
    <button id="signin" class="btn-primary" type="button">Open dashboard</button>
    <p id="gate-error" class="gate-error" role="alert"></p>
  </div>
</div>

<div id="app" hidden>

  <aside class="rail">
    <div class="rail-in">
    <div class="rail-brand" id="rail-emblem" aria-hidden="true"></div>

    <!-- Every entry goes somewhere real: three pages and the chat drawer. Tasks
         is deliberately absent — "This Week" is a summary that belongs on the
         dashboard, not a section of its own. -->
    <nav class="rail-nav" aria-label="Sections">
      <button class="rail-item" data-page="dashboard" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="8" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="11" width="7" height="10" rx="1.5"></rect>
        </svg>
        <span>Dashboard</span>
      </button>
      <button class="rail-item" id="rail-chat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6.5A8 8 0 0 1 11 4h2a8 8 0 0 1 8 8z"></path>
        </svg>
        <span>Ask</span>
      </button>
      <button class="rail-item" data-page="calendar" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"></rect>
          <path d="M3 10h18M8 3v4M16 3v4"></path>
        </svg>
        <span>Calendar</span>
      </button>
      <button class="rail-item" data-page="news" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5h11v14H4z"></path>
          <path d="M15 9h5v8a2 2 0 0 1-2 2h-3"></path>
          <path d="M7 9h5M7 12h5M7 15h3"></path>
        </svg>
        <span>News</span>
      </button>
    </nav>

    <div class="rail-foot">
      <div class="rail-meta">
        <span class="rail-meta-l">Timezone</span>
        <span class="rail-meta-v" id="rail-tz">Asia/Singapore</span>
      </div>
      <div class="rail-meta">
        <span class="rail-meta-l">Feeds</span>
        <span class="rail-meta-v ok" id="rail-feeds">Online</span>
      </div>
    </div>
    </div>
  </aside>

  <header class="topbar">
    <div>
      <h1 id="greeting" class="greeting">Good morning</h1>
      <p class="topbar-date">
        <span id="today-date">&nbsp;</span>
        <span class="topbar-sep">//</span>
        <span id="clock" class="topbar-clock">&nbsp;</span>
      </p>
    </div>
    <div class="topbar-right">
      <span id="stamp" class="stamp">&nbsp;</span>
      <button id="refresh" class="btn-ghost" type="button">Refresh</button>
    </div>
  </header>

  <main class="layout" id="page-dashboard">

    <section class="card card-calendar" aria-labelledby="h-cal">
      <div class="card-in">
      <span class="card-seam" aria-hidden="true"></span>
      <div class="card-head">
        <div class="card-head-left">
          <span class="card-icon icon-cal" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <path d="M3 10h18M8 3v4M16 3v4"></path>
            </svg>
          </span>
          <h2 id="h-cal" class="card-title">Google Calendar</h2>
        </div>
        <!-- Out of card-head-right on purpose: it is a direct child of the head
             so the grid can centre it against the whole card, not against
             whatever the controls happen to weigh. -->
        <span id="cal-range" class="card-meta"></span>
        <div class="card-head-right">
          <!-- Calendar page only. The dashboard card stays pinned to the real
               month so it cannot disagree with "This Week" beside it. -->
          <div class="cal-nav" id="cal-nav" hidden>
            <button class="cal-step" id="cal-prev" type="button" aria-label="Previous">&lsaquo;</button>
            <button class="cal-step is-now" id="cal-today" type="button">Today</button>
            <button class="cal-step" id="cal-next" type="button" aria-label="Next">&rsaquo;</button>
          </div>
          <div class="viewtoggle" id="viewtoggle" role="group" aria-label="Calendar view">
            <button class="vt" data-view="month" type="button">Month</button>
            <button class="vt" data-view="week" type="button">Week</button>
          </div>
        </div>
      </div>

      <div class="cal cal-month" id="cal-month" hidden>
        <div class="mon-daybar" id="mon-daybar"></div>
        <div class="mon-grid" id="mon-grid"></div>
      </div>

      <div class="cal cal-week" id="cal-week" hidden>
        <div class="cal-daybar">
          <div class="cal-gutter-head" id="tz-label"></div>
          <div class="cal-days" id="cal-days"></div>
        </div>
        <div class="cal-allday" id="cal-allday" hidden></div>
        <div class="cal-body">
          <div class="cal-gutter" id="cal-gutter"></div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>
      <p id="calendar-error" class="card-error" hidden></p>
      </div>
    </section>

    <section class="card card-week" aria-labelledby="h-week">
      <div class="card-in">
      <span class="card-seam" aria-hidden="true"></span>
      <div class="card-head">
        <div class="card-head-left">
          <span class="card-icon icon-week" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 7.5l2 2 3.5-3.5"></path>
              <path d="M3.5 17.5l2 2 3.5-3.5"></path>
              <path d="M13 7h7.5M13 18h7.5"></path>
            </svg>
          </span>
          <h2 id="h-week" class="card-title">This Week</h2>
        </div>
        <div class="progress-wrap">
          <span class="progress-label">Progress</span>
          <span class="progress-track"><span id="progress-fill" class="progress-fill"></span></span>
          <span id="progress-pct" class="progress-pct">0%</span>
        </div>
      </div>
      <div class="filters" id="filters" role="tablist">
        <button class="chip is-active" data-filter="all" role="tab" type="button">All <span class="chip-n" id="n-all">0</span></button>
        <button class="chip" data-filter="task" role="tab" type="button">Tasks <span class="chip-n" id="n-task">0</span></button>
        <button class="chip" data-filter="event" role="tab" type="button">Events <span class="chip-n" id="n-event">0</span></button>
      </div>
      <div id="week-list" class="week-list"></div>
      <p id="tasks-error" class="card-error" hidden></p>
      </div>
    </section>

    <section class="card card-news" aria-labelledby="h-news">
      <div class="card-in">
      <span class="card-seam" aria-hidden="true"></span>
      <div class="card-head">
        <div class="card-head-left">
          <span class="card-icon icon-news" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"></path>
            </svg>
          </span>
          <h2 id="h-news" class="card-title">Global Events &amp; News</h2>
        </div>
        <div class="card-head-right">
          <span id="news-meta" class="card-meta"></span>
          <!-- News page only. lib/news.js interleaves the feeds by recency on
               purpose, so that stays the default; grouping is offered beside it
               rather than replacing it. -->
          <div class="viewtoggle" id="news-sort" role="group" aria-label="News order" hidden>
            <button class="vt" data-sort="latest" type="button">Latest</button>
            <button class="vt" data-sort="source" type="button">By source</button>
          </div>
        </div>
      </div>
      <div id="news" class="news-list"></div>
      <p id="news-error" class="card-error" hidden></p>
      </div>
    </section>

  </main>

  <!-- The Calendar and News cards are moved into these by setPage(); there is
       one of each in the document, so every id and every wired handler stays
       unique whichever page is showing. -->
  <main class="page" id="page-calendar" hidden></main>
  <main class="page" id="page-news" hidden></main>

  <aside class="chat" id="chat" aria-label="Assistant">
    <div class="chat-in">
      <div class="chat-head">
        <span class="card-icon icon-week" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6.5A8 8 0 0 1 11 4h2a8 8 0 0 1 8 8z"></path>
          </svg>
        </span>
        <h2 class="card-title">Assistant</h2>
        <button class="chat-close" id="chat-close" type="button" aria-label="Close assistant">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M5 5l14 14M19 5L5 19"></path>
          </svg>
        </button>
      </div>
      <div class="chat-log" id="chat-log">
        <p class="chat-empty">General questions only<br>No dashboard data is sent</p>
      </div>
      <div class="chat-form">
        <textarea class="chat-input" id="chat-input" rows="2" placeholder="Ask anything…"></textarea>
        <button class="chat-send" id="chat-send" type="button">Send</button>
      </div>
    </div>
  </aside>
</div>

<script src="/emblem.js"></script>
<script src="/boot.js"></script>
<script src="/app.js"></script>
<script src="/chat.js"></script>
</body>
</html>
